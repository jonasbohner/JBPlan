  --grad:linear-gradient(135deg,#3D5AFE 0%,#7A4DFF 100%);
  --shadow:0 1px 2px rgba(14,20,36,.05), 0 10px 30px -18px rgba(14,20,36,.35);
  --r:20px; --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper)}
body{color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3,.disp{font-family:'Barlow Condensed','Inter',sans-serif;font-weight:700;letter-spacing:.005em;margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad)}

/* ---------- Kopf: dunkler Block ---------- */
header{background:var(--ink);color:#fff;border-radius:0 0 26px 26px;
  padding:calc(env(safe-area-inset-top) + 16px) 0 16px;
  box-shadow:0 14px 40px -26px rgba(14,20,36,.9);position:relative;overflow:hidden}
header::after{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;
  background:radial-gradient(circle,rgba(122,77,255,.45),transparent 68%);pointer-events:none}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:2}
.hdr .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.hdr h1{font-size:32px;line-height:.95;text-transform:uppercase;margin-top:2px}
.chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;
  padding:9px 13px;text-align:center;min-width:80px}
.chip .num{font-size:24px;font-weight:600;line-height:1}
.chip .lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-top:2px}

.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px;position:relative;z-index:2}
.rail .d{position:relative;height:44px;border-radius:11px;background:rgba(255,255,255,.07);overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.rail .d .fill{position:absolute;left:0;right:0;bottom:0;background:var(--go-2);transition:height .5s cubic-bezier(.4,0,.2,1)}
.rail .d .tag{position:relative;z-index:2;font-size:11px;font-weight:600;letter-spacing:.09em;color:rgba(255,255,255,.55)}
.rail .d.done .tag,.rail .d.today .tag{color:#fff}
.rail .d.today{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.rail .d .dot{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85;z-index:2}

/* ---------- Karten ---------- */
main{padding-top:18px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.dark{background:var(--ink);color:#fff}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:600;
  margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card.dark .eyebrow{color:var(--ink3)}
.card h2{font-size:21px;text-transform:uppercase;line-height:1.05}
.muted{color:var(--ink2)} .small{font-size:13px} .xs{font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line);margin:16px 0}

/* ---------- Tagesring ---------- */
.ring{display:flex;align-items:center;gap:18px}
.ring svg{flex:0 0 128px;width:128px;height:128px}
.ring .mid{text-anchor:middle}
.ring .legend{flex:1;min-width:0}
.lg{display:flex;align-items:center;gap:9px;padding:7px 0;cursor:pointer}
.lg .sw{width:11px;height:11px;border-radius:4px;flex:0 0 11px;background:var(--line)}
.lg.on .sw{background:var(--c)}
.lg b{font-weight:600;font-size:13.5px;flex:1}
.lg .st{font-size:11px;color:var(--ink2)}
.lg.on .st{color:var(--go);font-weight:600}

/* ---------- Checkliste / Slots ---------- */
.check{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:none}
.box{width:27px;height:27px;flex:0 0 27px;border:2px solid var(--line);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent;transition:.18s}
.check.on .box{background:var(--go);border-color:var(--go);color:#fff}
.check .txt{flex:1}
.check .txt b{font-weight:600}
.check .txt span{display:block;font-size:12px;color:var(--ink2)}

.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:13px;background:#FBFAF7;transition:.18s}
.slot .b2{width:19px;height:19px;flex:0 0 19px;border:2px solid var(--line);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent}
.slot.on{background:var(--go);border-color:var(--go);color:#fff}
.slot.on .b2{background:#fff;border-color:#fff;color:var(--go)}
.slot b{font-weight:600;font-size:14px;flex:1}
.slot .h{font-size:11px;opacity:.72}

/* ---------- Buttons ---------- */
button{cursor:pointer;font-family:inherit}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;background:var(--ink);color:#fff;
  font:600 15px 'Inter',sans-serif;transition:transform .12s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4}
.btn.go{background:var(--go)}
.btn.grad{background:var(--grad);box-shadow:0 8px 20px -10px rgba(61,90,254,.8)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:11px;font-size:13.5px;border-radius:11px}
.row{display:flex;gap:8px} .row .btn{flex:1}

/* ---------- Übungen ---------- */
.ex{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ex:last-child{border-bottom:none}
.ex .n{font-size:11px;font-weight:600;color:#fff;background:var(--ink);width:22px;height:22px;flex:0 0 22px;
  border-radius:7px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ex.stretch .n{background:var(--go)}
.ex .b{flex:1}
.ex .b b{font-weight:600;font-size:14.5px}
.ex .b p{margin:3px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.4}
.ex .t{font-size:12px;color:var(--ink2);white-space:nowrap;padding-top:2px;text-align:right}
.ex .t i{display:block;font-style:normal;font-size:10px;color:var(--ink3)}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:11px;padding:5px 10px;border-radius:99px;background:#F4F2ED;color:var(--ink2);font-weight:500}
.pill.sig{background:rgba(61,90,254,.1);color:var(--signal)}
.pill.go{background:rgba(27,127,92,.12);color:var(--go)}
.pill.sand{background:rgba(216,154,52,.16);color:#9A6B12}
.card.dark .pill{background:rgba(255,255,255,.12);color:#fff}

/* ---------- Segmente / Auswahl ---------- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#F4F2ED;padding:5px;border-radius:14px}
.seg button{padding:11px 0;border:none;background:transparent;border-radius:10px;font:600 14px 'Inter';color:var(--ink2);transition:.18s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px -3px rgba(14,20,36,.3)}

/* ---------- Rezept ---------- */
.rec h3{font-size:19px;text-transform:none;font-family:'Inter';font-weight:700;line-height:1.25;letter-spacing:-.01em}
.macros{display:flex;gap:8px;margin-top:10px}
.macros div{flex:1;background:#F7F5F1;border-radius:11px;padding:9px 6px;text-align:center}
.macros .v{font-size:16px;font-weight:600;line-height:1}
.macros .l{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:3px}
.ing{margin:14px 0 0;padding:0;list-style:none;font-size:13.5px}
.ing li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #F0EEE9}
.ing li:last-child{border-bottom:none}
.ing .q{flex:0 0 78px;text-align:right;font-weight:600}
.ing .nm{flex:1;color:var(--ink2)}
.steps{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:30px;margin:9px 0;font-size:13.5px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:7px;
  background:#F4F2ED;color:var(--ink2);font:600 11px 'IBM Plex Mono';display:flex;align-items:center;justify-content:center}
.stars{display:flex;gap:6px;margin-top:16px;align-items:center}
.stars button{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:11px;
  font-size:16px;line-height:1;color:var(--line);padding:0;transition:.15s}
.stars button.on{background:var(--sand);border-color:var(--sand);color:#fff}

/* ---------- Eingaben ---------- */
label.f{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#FBFAF7;
  font:400 16px 'Inter',sans-serif;color:var(--ink);appearance:none;transition:.15s}
input:focus,textarea:focus{outline:none;border-color:var(--signal);background:#fff;box-shadow:0 0 0 3px rgba(61,90,254,.1)}
input.mono,textarea.mono{font-family:'IBM Plex Mono',monospace}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sportsel{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sportsel button{padding:13px 2px;border:1px solid var(--line);background:#FBFAF7;border-radius:14px;
  font:600 11.5px 'Inter';color:var(--ink2);display:flex;flex-direction:column;gap:5px;align-items:center;transition:.18s}
.sportsel button .ic{font-size:18px}
.sportsel button.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px rgba(61,90,254,.9)}

/* ---------- Listen ---------- */
.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.logitem:last-child{border-bottom:none}
.logitem .ic{width:36px;flex:0 0 36px;height:36px;border-radius:12px;background:#F4F2ED;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink2)}
.logitem .m{flex:1;min-width:0}
.logitem .m b{font-size:14px;font-weight:600}
.logitem .m span{display:block;font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logitem .del{background:none;border:none;color:var(--ink3);font-size:19px;padding:4px 6px}

/* ---------- Kennzahlen ---------- */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#F7F5F1;border-radius:14px;padding:12px 6px;text-align:center}
.kpi .v{font-size:22px;font-weight:600;line-height:1.05}
.kpi .l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin-top:4px;line-height:1.25}
.trend{margin-top:16px}
.trend .th{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.trend .th b{font-size:13.5px;font-weight:600}
.trend .th span{font-size:11px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:5px;height:52px}
.bars .b{flex:1;background:#F2F0EB;border-radius:5px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;overflow:hidden}
.bars .b i{display:block;border-radius:5px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.barlbl{display:flex;gap:5px;margin-top:5px}
.barlbl span{flex:1;text-align:center;font-size:9px;color:var(--ink3)}
.dist{display:flex;align-items:center;gap:11px;margin:9px 0}
.dist .nm{width:74px;flex:0 0 74px;font-size:12px;font-weight:500}
.dist .tr{flex:1;height:8px;background:#F2F0EB;border-radius:4px;overflow:hidden}
.dist .tr i{display:block;height:100%;background:var(--grad);border-radius:4px}
.dist .vl{width:62px;text-align:right;font-size:11px;color:var(--ink2)}

.review{border-left:3px solid var(--signal);padding-left:14px;margin-top:12px}
.review p{margin:0 0 8px;font-size:13.5px}
.review ul{margin:6px 0 0;padding-left:17px;font-size:13.5px}
.review li{margin:5px 0}

/* ---------- Navigation ---------- */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid rgba(14,20,36,.07);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:none;padding:11px 0 13px;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--ink3);transition:color .15s}
nav button .ic{font-size:17px;line-height:1}
nav button .lb{font-size:10px;font-weight:600;letter-spacing:.04em}
nav button.on{color:var(--signal)}

/* ---------- Timer ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.overlay.on{display:flex}
.overlay::before{content:"";position:absolute;top:-90px;left:-60px;width:280px;height:280px;
  background:radial-gradient(circle,rgba(61,90,254,.35),transparent 70%);pointer-events:none}
.overlay.rest{background:#0A2E23}
.overlay.rest::before{background:radial-gradient(circle,rgba(37,161,117,.35),transparent 70%)}
.ov-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);position:relative;z-index:2}
.ov-top button{background:none;border:none;color:var(--ink3);font-size:22px;padding:0 4px}
.ov-mid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;z-index:2}
.ov-mid .clock{font-size:92px;font-weight:600;line-height:1;letter-spacing:-.03em}
.ov-mid h2{font-size:32px;margin-top:14px;text-transform:uppercase;line-height:1.05}
.ov-mid p{color:rgba(255,255,255,.62);font-size:14px;margin:10px auto 0;max-width:300px;line-height:1.45}
.ov-prog{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;margin-top:26px}
.ov-prog i{display:block;height:100%;background:#fff;width:0;transition:width .9s linear}
.ov-next{color:rgba(255,255,255,.5);font-size:11px;margin-top:16px;letter-spacing:.1em;text-transform:uppercase}
.ov-btn{margin-top:20px;padding:16px;border-radius:14px;border:none;background:#fff;color:var(--ink);font:600 15px 'Inter';position:relative;z-index:2}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-size:13.5px;z-index:70;
  opacity:0;pointer-events:none;transition:.25s;max-width:88%;box-shadow:0 12px 30px -12px rgba(14,20,36,.7)}
.toast.on{opacity:1}
.hide{display:none!important}
.card,.rail .d{animation:rise .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ---------- Mahlzeiten-Quelle & Tages-Editor ---------- */
.srcsel{display:flex;gap:6px;margin:6px 0 2px;padding-left:30px}
.srcsel button{flex:1;padding:9px 6px;border:1px solid var(--line);background:#fff;border-radius:11px;
  font:600 11.5px 'Inter';color:var(--ink2);transition:.15s}
.srcsel button.on{background:rgba(61,90,254,.09);border-color:var(--signal);color:var(--signal)}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.daychips::-webkit-scrollbar{display:none}
.daychips button{flex:0 0 auto;min-width:56px;padding:9px 8px;border:1px solid var(--line);background:#FBFAF7;
  border-radius:13px;font:600 12.5px 'Inter';color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.daychips button .dd{font-size:9.5px;opacity:.7;font-weight:500}
.daychips button i{width:5px;height:5px;border-radius:50%;background:var(--go);display:block;margin-top:1px}
.daychips button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.daychips button.on i{background:var(--go-2)}
input[type=date]{font-family:'IBM Plex Mono',monospace;font-size:15px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hdr">
      <div>
        <div class="sub">Halbmarathon &middot; 12.10.2026</div>
        <h1>Sub 1:30</h1>
      </div>
      <div class="chip">
        <div class="num mono" id="cdNum">&ndash;</div>
        <div class="lbl" id="cdLbl">Tage</div>
      </div>
    </div>
    <div class="rail" id="rail"></div>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav>
  <div class="navin">
    <button data-tab="heute" class="on"><span class="ic">&#9673;</span><span class="lb">Heute</span></button>
    <button data-tab="woche"><span class="ic">&#9636;</span><span class="lb">Woche</span></button>
    <button data-tab="essen"><span class="ic">&#9681;</span><span class="lb">Essen</span></button>
    <button data-tab="werte"><span class="ic">&#9902;</span><span class="lb">Werte</span></button>
  </div>
</nav>

<div class="overlay" id="ov">
  <div class="ov-top"><span id="ovKind">Einheit</span><button id="ovClose">&#10005;</button></div>
  <div class="ov-mid">
    <div class="clock mono" id="ovClock">0:55</div>
    <h2 id="ovName">Bereit</h2>
    <p id="ovHint"></p>
    <div class="ov-prog"><i id="ovBar"></i></div>
    <div class="ov-next" id="ovNext"></div>
  </div>
  <button class="ov-btn" id="ovToggle">Pause</button>
</div>

<div class="toast" id="toast"></div>
<script>
/* ============================================================
   SUB 1:30 - Trainings- & Ernaehrungsbegleiter
   Schema-Version 2. Bestehende Daten werden migriert, nicht ersetzt.
   ============================================================ */

const SCHEMA = 3;
const KEY    = "sub130:v1";          // Schluessel bleibt stabil ueber alle Versionen
const RACE   = new Date(2026,9,12);
const GOAL_SEC = 90*60;
const DIST = 21.0975;
const WORK_SEC = 55, REST_SEC = 5, STRETCH_SEC = 60;

/* ---------- Rumpf / Bauch, ohne Geraete ---------- */
const CORE = [
 {n:"Unterarmstütz",d:"Ellbogen unter Schultern, Po fest, Rippen nach unten ziehen. Nicht durchhängen.",lvl:1},
 {n:"Dead Bug",d:"Rücken flach am Boden. Gegengleich Arm und Bein absenken, langsam.",lvl:1},
 {n:"Bird Dog",d:"Vierfüßler. Arm und gegenüberliegendes Bein strecken, 2 Sek halten, wechseln.",lvl:1},
 {n:"Reverse Crunch",d:"Knie zur Brust ziehen, Becken kontrolliert vom Boden lösen. Kein Schwung.",lvl:1},
 {n:"Käfer / Bicycle Crunch",d:"Ellbogen zum gegenüberliegenden Knie, Schulterblätter bleiben oben.",lvl:1},
 {n:"Seitstütz links",d:"Ellbogen unter Schulter, Hüfte hoch, Körper in einer Linie.",lvl:1},
 {n:"Seitstütz rechts",d:"Gleiche Ausführung, andere Seite. Hüfte nicht absinken lassen.",lvl:1},
 {n:"Superman",d:"Bauchlage, Arme und Beine anheben, unteren Rücken aktiv halten.",lvl:1},
 {n:"Hollow Hold",d:"Rücken flach gedrückt, Arme und Beine knapp über dem Boden halten.",lvl:2},
 {n:"Mountain Climbers",d:"Liegestützposition, Knie zügig zur Brust. Hüfte bleibt tief.",lvl:2},
 {n:"Beinheben liegend",d:"Beine gestreckt absenken, unterer Rücken bleibt am Boden.",lvl:2},
 {n:"Bear Plank Shoulder Taps",d:"Knie schweben handbreit über dem Boden, abwechselnd Schulter tippen.",lvl:2},
 {n:"Plank Up-Downs",d:"Vom Unterarmstütz in den Liegestütz und zurück, Hüfte ruhig halten.",lvl:3},
 {n:"Hollow Rocks",d:"Aus dem Hollow Hold kontrolliert schaukeln, Spannung nie verlieren.",lvl:3},
 {n:"Russian Twist",d:"Aufrecht sitzen, Füße schweben, Oberkörper rotieren, Bauch bleibt fest.",lvl:3},
 {n:"Copenhagen Plank kurz",d:"Seitstütz, oberes Bein auf Sofa oder Stuhl, Hüfte hoch.",lvl:3,side:true}
];

/* ---------- Dehnen: Beine, Fokus hintere Oberschenkel ---------- */
const STRETCH = [

/* ---------- Hilfsfunktionen ---------- */
const DAYS=["So","Mo","Di","Mi","Do","Fr","Sa"];
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parseKey = k => {const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c);};
const isWeekday = d => d.getDay()>=1 && d.getDay()<=5;
const addDays = (d,n) => {const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function isoWeekKey(d){
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  t.setDate(t.getDate()+4-(t.getDay()||7));
  const y0=new Date(t.getFullYear(),0,1);
  return `${t.getFullYear()}-KW${String(Math.ceil(((t-y0)/86400000+1)/7)).padStart(2,"0")}`;
}
function mondayOf(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x;}
function fmtPace(sec){return `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,"0")}`;}
function fmtClock(sec){return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`;}
function seedPick(arr,seed,count){
  const pool=[...arr],out=[];let s=seed;
  while(out.length<count && pool.length){s=(s*9301+49297)%233280;out.push(pool.splice(Math.floor(s/233280*pool.length),1)[0]);}
  return out;
}
const dayIndex = d => Math.floor((d-new Date(2026,0,1))/86400000);
const today = () => new Date();

/* ---------- Mengen skalieren ---------- */
function fmtQ(q){
  if(q>=20)return String(Math.round(q/5)*5);
  const r=Math.round(q*4)/4, whole=Math.floor(r), frac=+(r-whole).toFixed(2);
  const map={0.25:"¼",0.5:"½",0.75:"¾"};
  if(map[frac])return (whole?whole:"")+map[frac];
  return String(+r.toFixed(1));
}
function unitPlural(u,q){const m={"Dose":"Dosen","Scheibe":"Scheiben","Zehe":"Zehen","Stange":"Stangen"};return (q>1&&m[u])?m[u]:u;}
function ingLine(i,p){
  if(i.q===null||i.q===undefined)return {q:"nach Bedarf",n:i.n};
  const q=i.q*p;
  return {q:(fmtQ(q)+" "+unitPlural(i.u||"",q)).trim(), n:(q>1&&i.p)?i.p:i.n};
}

/* ---------- Speicher: drei Ebenen ---------- */
const store = {
  mode:"session",                                  // claude | lokal | session
  async init(){
    if(typeof window!=="undefined" && window.storage && window.storage.get){ this.mode="claude"; return; }
    try{ localStorage.setItem("__probe","1"); localStorage.removeItem("__probe"); this.mode="lokal"; }
    catch(e){ this.mode="session"; }
  },
  async read(){
    try{
      if(this.mode==="claude"){ const r=await window.storage.get(KEY); return r?r.value:null; }
      if(this.mode==="lokal"){ return localStorage.getItem(KEY); }
    }catch(e){}
    return null;
  },
  async write(str){
    try{
      if(this.mode==="claude"){ await window.storage.set(KEY,str); return true; }
      if(this.mode==="lokal"){ localStorage.setItem(KEY,str); return true; }
    }catch(e){}
    return false;
  },
  label(){ return this.mode==="claude"?"Claude-Profil":this.mode==="lokal"?"Safari auf diesem Gerät":"nur diese Sitzung"; }
};

/* ---------- Zustand + Migration ---------- */
const blank = () => ({v:SCHEMA,days:{},weights:[],sessions:[],ratings:{},reviews:[],level:1,lastWeek:null,persons:1});
let S = blank(), TAB="heute", memoryOnly=false;

function migrate(raw){
  const s=Object.assign(blank(),raw||{});          // unbekannte Felder bleiben erhalten
  for(const k in s.days){
    const d=s.days[k]||{};
    if(typeof d.meals==="number"){                 // Schema 1: Zaehler 0-3
      const n=d.meals;
      d.meals={b:n>=1,l:n>=2,d:n>=3};
    }
    if(!d.meals||typeof d.meals!=="object")d.meals={b:false,l:false,d:false};
    if(!d.msrc||typeof d.msrc!=="object")d.msrc={};   // Schema 3: rezept | anders
    d.workout=!!d.workout; d.stretch=!!d.stretch;
    s.days[k]=d;
  }
  if(!Array.isArray(s.weights))s.weights=[];
  if(!Array.isArray(s.sessions))s.sessions=[];
  if(!Array.isArray(s.reviews))s.reviews=[];
  if(!s.ratings||typeof s.ratings!=="object")s.ratings={};
  s.persons=Math.min(4,Math.max(1,s.persons||1));
  s.level=Math.min(3,Math.max(1,s.level||1));
  s.v=SCHEMA;
  return s;
}
async function load(){
  await store.init();
  memoryOnly = store.mode==="session";
  const raw=await store.read();
  if(raw){ try{ S=migrate(JSON.parse(raw)); }catch(e){ S=blank(); } }
  else { S=blank(); await save(); }
}
async function save(){
  const ok=await store.write(JSON.stringify(S));
  if(!ok && !memoryOnly){ memoryOnly=true; toast("Speichern fehlgeschlagen. Daten gelten nur für diese Sitzung."); }
}
function dayRec(k){
  if(!S.days[k])S.days[k]={workout:false,stretch:false,meals:{b:false,l:false,d:false},msrc:{}};
  if(!S.days[k].msrc)S.days[k].msrc={};
  return S.days[k];
}
const mealCount = r => r&&r.meals ? ["b","l","d"].filter(x=>r.meals[x]).length : 0;
const dayComplete = r => !!(r&&r.workout&&r.stretch&&mealCount(r)>=2);

/* ---------- Serie: nur Mo-Fr ---------- */
function streak(){
  let n=0,d=today();const tk=dkey(today());
  for(let i=0;i<400;i++){
    if(!isWeekday(d)){d=addDays(d,-1);continue;}
    const r=S.days[dkey(d)];
    if(dayComplete(r))n++;
    else if(dkey(d)===tk){}
    else break;
    d=addDays(d,-1);
  }
  return n;
}
function bestStreak(){
  const keys=Object.keys(S.days).filter(k=>dayComplete(S.days[k])&&isWeekday(parseKey(k))).sort();
  let best=0,cur=0,prev=null;
  for(const k of keys){
    const d=parseKey(k);
    if(prev){let p=addDays(prev,1);while(!isWeekday(p))p=addDays(p,1);cur=dkey(p)===k?cur+1:1;}
    else cur=1;
    best=Math.max(best,cur);prev=d;
  }
  return best;
}

/* ---------- Wettkampf ---------- */
const daysToRace = () => Math.ceil((RACE-new Date(new Date().toDateString()))/86400000);
const weeksToRace = () => Math.max(0,Math.ceil(daysToRace()/7));
const pacePerKm = GOAL_SEC/DIST;
function phase(){
  const w=weeksToRace();
  if(w>7)return{n:"Grundlage",d:"Umfang und lange Läufe. Rumpf stabilisieren, Rückseite geschmeidig halten.",km:"45–55 km",key:"Longrun 18–20 km locker + 1× Tempodauerlauf 6 km @ 4:30"};
  if(w>4)return{n:"Aufbau",d:"Schwelle und Intervalle. Jetzt zahlt sich die tägliche Mobilität aus.",km:"50–60 km",key:"5×1000 m @ 4:00–4:05 · Longrun 20 km mit 5 km Endbeschleunigung"};
  if(w>2)return{n:"Schärfung",d:"Wettkampftempo einschleifen, Umfang leicht zurück.",km:"45–50 km",key:"3×3 km @ 4:16 · Longrun 16 km mit 8 km im Renntempo"};
  if(w>0)return{n:"Taper",d:"Umfang runter, Spritzigkeit halten. Dehnen bleibt, Rumpf nur locker.",km:"25–35 km",key:"6×400 m zügig · letzte 3 Tage nur Ausdauerlauf + Steigerungen"};
  return{n:"Wettkampf",d:"Renntag. 4:16/km, gleichmäßig anlaufen.",km:"—",key:"21,1 km"};
}

/* ---------- Tagesplan ---------- */
function coreOfDay(d){
  const pool=CORE.filter(e=>e.lvl<=S.level);
  return seedPick(pool.length>=5?pool:CORE,dayIndex(d)*7+3,5);
}
const stretchOfDay = d => seedPick(STRETCH,dayIndex(d)*13+11,5);

function coreSteps(d){
  const out=[];
  coreOfDay(d).forEach((e,i,arr)=>{
    out.push({n:e.n,d:e.d,sec:WORK_SEC,rest:false,side:!!e.side});
    out.push({n:"Pause",d:i<arr.length-1?`Kurz durchatmen. Als Nächstes: ${arr[i+1].n}.`:"Letzte Pause. Gleich geschafft.",sec:REST_SEC,rest:true});
  });
  return out;
}
const stretchSteps = d => stretchOfDay(d).map(e=>({n:e.n,d:e.d,sec:STRETCH_SEC,rest:false,side:!!e.side}));

/* ---------- Rezeptlogik ---------- */
function tagScores(){
  const sc={};
  for(const[id,r]of Object.entries(S.ratings)){
    const rec=RECIPES.find(x=>x.id===id);if(!rec)continue;
    rec.tags.forEach(t=>{sc[t]=(sc[t]||0)+(r-3);});
  }
  return sc;
}
function contextBoost(){
  const b={};
  const recent=S.sessions.filter(s=>(new Date()-parseKey(s.date))/86400000<=3);
  if(recent.some(s=>(s.km&&s.km>=12)||(s.rpe&&s.rpe>=7))){b.kohlenhydrate=1.5;b.recovery=1.5;}
  const ph=phase().n;
  if(ph==="Aufbau"||ph==="Schärfung"){b.kohlenhydrate=(b.kohlenhydrate||0)+1;b.protein=(b.protein||0)+.5;}
  if(ph==="Taper")b.leicht=(b.leicht||0)+1;
  const f=S.reviews.length?S.reviews[S.reviews.length-1].fokus:null;
  if(f)b[f]=(b[f]||0)+2;
  return b;
}
function recommend(type,d){
  const ts=tagScores(),cb=contextBoost(),seed=dayIndex(d)*31+(type==="mittag"?5:17);
  return RECIPES.filter(r=>r.t===type).map(r=>{
    let sc=0;
    r.tags.forEach(t=>{sc+=(ts[t]||0)*1.2+(cb[t]||0);});
    if(S.ratings[r.id]===1)sc-=4;
    if(S.ratings[r.id]===2)sc-=1.5;
    return{r,sc:sc+((seed*(r.id.charCodeAt(0)+r.id.charCodeAt(1)))%97)/97};
  }).sort((a,b)=>b.sc-a.sc)[0].r;
}

/* ---------- Wochenauswertung ---------- */
function weekStats(monday){
  const st={done:0,workout:0,stretch:0,mealsOk:0,km:0,sessions:0,ausRezept:0,mahlzeiten:0};
  for(let i=0;i<5;i++){
    const r=S.days[dkey(addDays(monday,i))];if(!r)continue;
    if(r.workout)st.workout++;
    if(r.stretch)st.stretch++;
    if(mealCount(r)>=2)st.mealsOk++;
    ["b","l","d"].forEach(x=>{ if(r.meals[x]){ st.mahlzeiten++; if((r.msrc||{})[x]==="rezept")st.ausRezept++; } });
    if(dayComplete(r))st.done++;
  }
  const end=addDays(monday,7);
  S.sessions.forEach(s=>{const d=parseKey(s.date);if(d>=monday&&d<end){st.sessions++;st.km+=(s.km||0);}});
  return st;
}
function buildReview(monday){
  const st=weekStats(monday);
  const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);
  const last=ws[ws.length-1],prev=ws[ws.length-2];
  const delta=last&&prev?+(last.kg-prev.kg).toFixed(1):null;
  const punkte=[];

  if(st.done>=5)punkte.push("Alle fünf Werktage vollständig. Genau so bleibt die Rückseite bis Oktober belastbar.");
  else if(st.done>=3){
    const schwach=[["Rumpf",st.workout],["Dehnen",st.stretch],["Mahlzeiten",st.mealsOk]].sort((a,b)=>a[1]-b[1])[0][0];
    punkte.push(`${st.done} von 5 Werktagen komplett. Schwachstelle war ${schwach} — dafür einen festen Ankerpunkt im Tag setzen.`);
  }
  else punkte.push(`Nur ${st.done} von 5 Werktagen komplett. Setz die Hürde niedriger: erst die 5 Minuten Dehnen, der Rumpf folgt danach fast von allein.`);

  if(st.km>0)punkte.push(`${st.km.toFixed(0)} km in ${st.sessions} Einheiten protokolliert. Zielkorridor dieser Phase: ${phase().km}.`);
  else punkte.push(`Diese Woche keine Laufeinheit eingetragen — bei ${weeksToRace()} Wochen bis zum Start zählt vor allem die Regelmäßigkeit.`);

  let fokus=null;
  if(delta!==null){
    if(delta<=-1.0){punkte.push(`Gewicht ${delta} kg in einer Woche. Das ist schneller als sinnvoll, wenn parallel Umfang aufgebaut wird — Kohlenhydrate rund um die harten Einheiten hochziehen.`);fokus="kohlenhydrate";}
    else if(delta>=1.0){punkte.push(`Gewicht +${delta} kg. Oft Wasser nach harten Einheiten. Beobachte den Trend über zwei weitere Wiegetage, bevor du etwas änderst.`);fokus="leicht";}
    else punkte.push(`Gewicht ${delta>0?"+":""}${delta} kg — stabil. Passt zur aktuellen Belastung.`);
  } else punkte.push("Noch zu wenig Wiegedaten für einen Trend. Einmal pro Woche, gleicher Tag, gleiche Uhrzeit.");

  if(st.mahlzeiten>0){
    const q=Math.round(st.ausRezept/st.mahlzeiten*100);
    punkte.push(q>=50?`${st.ausRezept} von ${st.mahlzeiten} gesunden Mahlzeiten kamen aus den Rezepten (${q} %). Die Bewertungen darunter steuern die Vorschläge zuverlässig.`
      :`Nur ${st.ausRezept} von ${st.mahlzeiten} gesunden Mahlzeiten kamen aus den Rezepten. Die Vorschläge lernen fast nur aus bewerteten Gerichten — häufiger eins davon kochen schärft sie.`);
  }
  const top=Object.entries(tagScores()).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>0){punkte.push(`Deine Bewertungen laufen klar Richtung „${top[0]}“ — die Vorschläge gewichten das ab jetzt stärker.`);if(!fokus)fokus=top[0];}

  const alt=S.level;
  if(st.done>=4&&S.level<3)S.level++;
  if(st.done<=2&&S.level>1)S.level--;
  if(S.level!==alt)punkte.push(S.level>alt?`Rumpfeinheit auf Stufe ${S.level} angehoben — neue Übungen ab Montag.`:`Rumpfeinheit auf Stufe ${S.level} zurückgesetzt, damit die Serie wieder anläuft.`);

  return {week:isoWeekKey(monday),
    label:`${monday.getDate()}.${monday.getMonth()+1}. – ${addDays(monday,6).getDate()}.${addDays(monday,6).getMonth()+1}.`,
    done:st.done,km:+st.km.toFixed(1),delta,fokus,level:S.level,punkte,phase:phase().n,ai:null};
}
async function runWeeklyUpdate(){
  const cur=isoWeekKey(new Date());
  if(S.lastWeek===cur)return false;
  if(S.lastWeek===null){S.lastWeek=cur;await save();return false;}
  const m=addDays(mondayOf(new Date()),-7), st=weekStats(m);
  if(st.done===0&&st.sessions===0){S.lastWeek=cur;await save();return false;}
  if(S.reviews.some(r=>r.week===isoWeekKey(m))){S.lastWeek=cur;await save();return false;}

}

/* ---------- Timer ---------- */
let T={steps:[],i:0,left:0,run:false,tick:null,kind:""};
function startSession(kind){
  const d=today();
  T.steps = kind==="core" ? coreSteps(d) : stretchSteps(d);
  T.i=0;T.left=T.steps[0].sec;T.run=true;T.kind=kind;
  document.getElementById("ovKind").textContent = kind==="core"?"Rumpf · 5 Minuten":"Dehnen · 5 Minuten";
  document.getElementById("ov").classList.add("on");
  document.getElementById("ovToggle").textContent="Pause";
  paintTimer();beep(660);
  clearInterval(T.tick);
  T.tick=setInterval(()=>{
    if(!T.run)return;
    const cur=T.steps[T.i];
    T.left--;
    if(cur && cur.side && !cur.rest && T.left===Math.floor(cur.sec/2)){
      beep(990,.16); setTimeout(()=>beep(990,.16),200);      // Seitenwechsel: Doppelton
    }
    if(T.left>0 && T.left<=3){
      beep(cur && cur.rest ? 520 : 700, .1);                 // letzte drei Sekunden
    }
    if(T.left<=0){
      T.i++;
      if(T.i>=T.steps.length){finishSession();return;}
      T.left=T.steps[T.i].sec;
      beep(T.steps[T.i].rest?440:880,.3);
    }
    paintTimer();
  },1000);
}
function paintTimer(){
  const s=T.steps[T.i];if(!s)return;
  const total=T.steps.reduce((a,x)=>a+x.sec,0);
  const passed=T.steps.slice(0,T.i).reduce((a,x)=>a+x.sec,0)+(s.sec-T.left);
  document.getElementById("ovClock").textContent=fmtClock(T.left);
  document.getElementById("ovName").textContent=s.n;
  document.getElementById("ovHint").textContent=s.d;
  document.getElementById("ovBar").style.width=(passed/total*100)+"%";
  document.getElementById("ov").classList.toggle("rest",!!s.rest);
  const nx=T.steps[T.i+1], half=Math.floor(s.sec/2);
  let hint;
  if(s.side && !s.rest) hint = T.left>half ? `Erste Seite · Wechsel bei ${fmtClock(half)}` : "Zweite Seite";
  else hint = nx ? `Als Nächstes · ${nx.n}` : "Letzter Abschnitt";
  document.getElementById("ovNext").textContent=hint;
  document.getElementById("ovName").textContent = s.n + (s.side&&!s.rest&&T.left<=half ? " ›" : "");
}
async function finishSession(){
  clearInterval(T.tick);T.run=false;
  const r=dayRec(dkey(today()));
  if(T.kind==="core")r.workout=true;else r.stretch=true;
  await save();
  document.getElementById("ov").classList.remove("on","rest");
  beep(520);setTimeout(()=>beep(760),160);
  toast(T.kind==="core"?"Rumpfeinheit abgehakt.":"Dehneinheit abgehakt.");
  render();
}
let AC=null;
function beep(f,len){
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    if(!AC)AC=new C();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    const d=len||.25;
    g.gain.setValueAtTime(.0001,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.22,AC.currentTime+.012);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.start();o.stop(AC.currentTime+d+.02);
  }catch(e){}
}

      <div class="box">✓</div><div class="txt"><b>Beine dehnen</b><span>5 Minuten</span></div></div>

    <div class="eyebrow" style="margin:14px 0 8px"><span>Mahlzeiten</span><span>${mealCount(r)}/3 gesund</span></div>
    ${mealSlots(r,ek)}

    <div class="eyebrow" style="margin:16px 0 8px">Einheiten an diesem Tag</div>
    ${sess.length?sess.map(x=>logRow(x,false)).join(""):'<p class="xs muted" style="margin:0 0 10px">Noch nichts eingetragen.</p>'}
    <div class="sportsel" style="margin-top:8px">${[["Running","▲"],["Fußball","●"],["Radfahren","◆"],["Tennis","■"]].map(([sp,ic])=>
      `<button data-act="sportE" data-s="${sp}" class="${selSportE===sp?"on":""}"><span class="ic">${ic}</span>${sp}</button>`).join("")}</div>
    <div id="sportformE" class="${selSportE?"":"hide"}">
      <div class="grid2">
        <div><label class="f">Distanz (km)</label><input class="mono" type="text" inputmode="decimal" id="eKm" placeholder="0.0"></div>
        <div><label class="f">Dauer (min)</label><input class="mono" type="text" inputmode="numeric" id="eMin" placeholder="0"></div>
      </div>
      <label class="f">Anstrengung 1–10 (RPE)</label>
      <input class="mono" type="text" inputmode="numeric" id="eRpe" placeholder="6">
      <label class="f">Notiz (optional)</label>
      <textarea id="eNote" placeholder="Untergrund, Gefühl, Intervalle …"></textarea>
      <button class="btn" data-act="saveSessionE" style="margin-top:12px">Einheit für diesen Tag speichern</button>
    </div>
  </div>`;
}

/* ---------- Woche ---------- */
function viewWoche(){
  const st=weekStats(mondayOf(new Date())),rv=S.reviews.slice().reverse(),wk=last8Weeks();
  return `
  <div class="card">
    <div class="eyebrow"><span>Diese Woche</span><span>${isoWeekKey(new Date())}</span></div>
    <div class="kpi">
      <div><div class="v mono">${st.done}/5</div><div class="l">Komplett</div></div>
      <div><div class="v mono">${st.km.toFixed(0)}</div><div class="l">km gelaufen</div></div>
      <div><div class="v mono">${st.sessions}</div><div class="l">Einheiten</div></div>
    </div>
    <hr class="sep">
    ${trendBlock("Werktage komplett","letzte 8 Wochen",wk.map(w=>w.s.done),5,"var(--go)")}
    <div class="barlbl">${wk.map(w=>`<span>${w.m.getDate()}.${w.m.getMonth()+1}.</span>`).join("")}</div>
  </div>

  <div class="card">
    <div class="eyebrow"><span>Wochen-Update</span><span>automatisch montags</span></div>
    ${rv.length?rv.map((r,i)=>`
      <div>
        <h2 style="font-size:17px">${r.label}</h2>
        <div class="pills" style="margin:6px 0 2px">
          <span class="pill ${r.done>=4?"go":""}">${r.done}/5 Werktage</span>
          <span class="pill">${r.km} km</span>
          ${r.delta!==null&&r.delta!==undefined?`<span class="pill ${Math.abs(r.delta)>=1?"sand":""}">${r.delta>0?"+":""}${r.delta} kg</span>`:""}
          <span class="pill sig">${r.phase}</span></div>
        <div class="review">
          ${r.ai?`<p><b>${r.ai.analyse}</b></p><p class="muted"><b style="color:var(--ink)">Fokus:</b> ${r.ai.fokus_kommende_woche}</p>
            <ul>${(r.ai.tipps||[]).map(t=>`<li>${t}</li>`).join("")}</ul>
            ${r.ai.rezeptidee?`<p class="xs muted" style="margin-top:8px"><b style="color:var(--ink)">Rezeptidee:</b> ${r.ai.rezeptidee.name} — ${r.ai.rezeptidee.warum}</p>`:""}`
           :`<ul>${r.punkte.map(p=>`<li>${p}</li>`).join("")}</ul>`}
        </div>
        ${i===0&&!r.ai?`<button class="btn ghost sm" id="aiBtn" data-act="ai" data-i="${S.reviews.length-1}" style="margin-top:12px">Auswertung mit KI vertiefen</button>`:""}
      </div>`).join('<hr class="sep">')
    :`<p class="small muted" style="margin:0">Noch keine Auswertung. Die App wertet die Woche automatisch aus, sobald der nächste Montag beginnt — inklusive Anpassung von Übungsstufe und Rezeptgewichtung.</p>
      <button class="btn ghost sm" data-act="forceReview" style="margin-top:12px">Letzte Woche jetzt auswerten</button>`}
  </div>

  ${dayEditor()}

  <div class="card">
    <div class="eyebrow">Letzte Einheiten</div>
    ${S.sessions.slice(-12).reverse().map(s=>logRow(s,true)).join("")||'<p class="small muted" style="margin:0">Noch nichts protokolliert.</p>'}
  </div>`;
}

/* ---------- Essen ---------- */
function viewEssen(){
  const d=today(),r=dayRec(dkey(d)),p=S.persons;
  const m=recommend("mittag",d),a=recommend("abend",d);
  const ts=Object.entries(tagScores()).sort((x,y)=>y[1]-x[1]).slice(0,5);
  return `
  <div class="card">
    <div class="eyebrow">Kochen für</div>
    <div class="seg">${[1,2,3,4].map(n=>`<button data-act="persons" data-n="${n}" class="${p===n?"on":""}">${n}</button>`).join("")}</div>
    <p class="xs muted" style="margin:8px 0 0">Alle Mengen unten skalieren mit. Nährwerte gelten pro Person.</p>
  </div>

  <div class="card">
    <div class="eyebrow"><span>Mahlzeiten heute</span><span>${mealCount(r)}/3 gesund</span></div>
    ${mealSlots(r)}
    <p class="xs muted" style="margin:9px 0 0">Zwei von drei reichen für die Serie. „Gesund“ heißt hier: echte Zutaten, Kohlenhydrate passend zum Training, Eiweiß dabei.</p>
  </div>

  ${recipeCard(m,"Mittag")}
  ${recipeCard(a,"Abend")}

  <div class="card">
    <div class="eyebrow">Wie die Vorschläge entstehen</div>
    <p class="small muted" style="margin:0">Nach harten Einheiten steigt das Gewicht auf kohlenhydrat- und regenerationsstarke Gerichte, im Taper auf leichtere. Ein Stern zieht ein Gericht dauerhaft nach unten, fünf Sterne ziehen die ganze Kategorie nach oben.</p>
    ${ts.length?`<div class="pills">${ts.map(([t,v])=>`<span class="pill ${v>0?"go":""}">${t} ${v>0?"+":""}${v}</span>`).join("")}</div>`:""}
  </div>

  <div class="card">
    <div class="eyebrow">Alle Rezepte</div>
    ${["mittag","abend"].map(t=>`<p class="xs muted" style="margin:10px 0 4px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">${t==="mittag"?"Mittag":"Abend"}</p>
      ${RECIPES.filter(x=>x.t===t).map(x=>`<div class="logitem"><div class="m"><b>${x.n}</b>
        <span>${x.kcal} kcal · ${x.kh} g KH · ${x.pro} g Eiweiß</span></div>
        <span class="mono xs" style="color:var(--sand)">${S.ratings[x.id]?"★".repeat(S.ratings[x.id]):"–"}</span></div>`).join("")}`).join("")}
  </div>`;
}

/* ---------- Werte ---------- */
function viewWerte(){
  const ws=[...S.weights].sort((a,b)=>a.date<b.date?-1:1);
  const last=ws[ws.length-1],prev=ws[ws.length-2];
  const delta=last&&prev?+(last.kg-prev.kg).toFixed(1):null;
  const wiegedNow=ws.some(w=>isoWeekKey(parseKey(w.date))===isoWeekKey(new Date()));
  const wk=last8Weeks();
  const totalKm=S.sessions.reduce((s,x)=>s+(x.km||0),0);
  const totalDone=Object.values(S.days).filter(dayComplete).length;
  const totalW=Object.values(S.days).filter(x=>x.workout).length;
  const totalS=Object.values(S.days).filter(x=>x.stretch).length;
  const sports=["Running","Fußball","Radfahren","Tennis"];
  const maxSport=Math.max(1,...sports.map(y=>S.sessions.filter(x=>x.sport===y).length));

  return `
  <div class="card">
    <div class="eyebrow"><span>Auf einen Blick</span><span>${phase().n} · ${weeksToRace()} Wochen</span></div>
    <div class="kpi">
      <div><div class="v mono" style="color:var(--go)">${streak()}</div><div class="l">Serie aktuell</div></div>
      <div><div class="v mono">${bestStreak()}</div><div class="l">Rekordserie</div></div>
      <div><div class="v mono">${totalDone}</div><div class="l">Tage komplett</div></div>
    </div>
    <div class="kpi" style="margin-top:8px">
      <div><div class="v mono">${totalW}</div><div class="l">Rumpf-Einheiten</div></div>
      <div><div class="v mono">${totalS}</div><div class="l">Dehn-Einheiten</div></div>
      <div><div class="v mono">${totalKm.toFixed(0)}</div><div class="l">km gesamt</div></div>
    </div>
    <div class="kpi" style="margin-top:8px">
      <div><div class="v mono">${last?last.kg.toFixed(1):"–"}</div><div class="l">kg aktuell</div></div>
      <div><div class="v mono" style="color:${delta===null?"":delta<0?"var(--go)":delta>0?"var(--sand)":""}">${delta===null?"–":(delta>0?"+":"")+delta}</div><div class="l">kg zur Vorwoche</div></div>
      <div><div class="v mono">${S.sessions.length}</div><div class="l">Einheiten gesamt</div></div>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow"><span>Verläufe · letzte 8 Wochen</span><span>Tage pro Woche</span></div>
    ${trendBlock("Fitness","Rumpf & Bauch",wk.map(w=>w.s.workout),5,"var(--ink)")}
    ${trendBlock("Dehnen","Beine",wk.map(w=>w.s.stretch),5,"var(--go)")}
    ${trendBlock("Essen","Tage mit 2 von 3 gesund",wk.map(w=>w.s.mealsOk),5,"var(--sand)")}
    <div class="barlbl">${wk.map(w=>`<span>${w.m.getDate()}.${w.m.getMonth()+1}.</span>`).join("")}</div>
    <hr class="sep">
    <div class="trend"><div class="th"><b>Gewicht</b><span>${ws.length} ${ws.length===1?"Eintrag":"Einträge"}</span></div>${weightChart(ws)}</div>
  </div>

  <div class="card">
    <div class="eyebrow"><span>Gewicht eintragen</span><span>1× pro Woche</span></div>
    ${wiegedNow?'<p class="xs muted" style="margin:0 0 4px">Diese Woche bereits eingetragen — ein neuer Wert überschreibt den heutigen.</p>'
      :'<p class="xs" style="margin:0 0 4px;color:var(--sand);font-weight:600">Wiegen steht diese Woche noch aus.</p>'}
    <div class="row" style="margin-top:8px"><input class="mono" type="text" inputmode="decimal" id="wKg" placeholder="z. B. 74.2">
    <button class="btn" style="flex:0 0 110px" data-act="saveWeight">Eintragen</button></div>
  </div>

  <div class="card">
    <div class="eyebrow">Verteilung der Einheiten</div>
    ${sports.map(s=>{
      const c=S.sessions.filter(x=>x.sport===s).length;
      const km=S.sessions.filter(x=>x.sport===s).reduce((a,x)=>a+(x.km||0),0);
      return `<div class="dist"><span class="nm">${s}</span>
        <span class="tr"><i style="width:${c/maxSport*100}%"></i></span>
        <span class="vl mono">${c}${km?" · "+km.toFixed(0)+" km":""}</span></div>`;
    }).join("")}
  </div>

  <div class="card">
    <div class="eyebrow"><span>Daten &amp; Sicherung</span><span>Schema v${S.v}</span></div>
    <div class="logitem" style="border:none;padding-top:0">
      <div class="ic">◈</div><div class="m"><b>Gespeichert in: ${store.label()}</b>
      <span>${memoryOnly?"Achtung: kein dauerhafter Speicher verfügbar":"Bleibt über App-Updates hinweg erhalten"}</span></div></div>
    <p class="xs muted" style="margin:2px 0 12px">Vor jedem Umbau der App einmal die Sicherung kopieren — damit kommst du auch dann sauber rüber, wenn sich der Speicherort ändert.</p>
    <div class="row"><button class="btn ghost sm" data-act="export">Sicherung erstellen</button>
    <button class="btn ghost sm" data-act="showImport">Sicherung einspielen</button></div>
    <div id="dataBox"></div>
    <button class="btn ghost sm" data-act="reset" style="margin-top:8px;color:var(--ink2)">Alles zurücksetzen</button>
  </div>

  <div class="card">
    <div class="eyebrow">Auf dem iPhone installieren</div>
    <ul class="steps" style="margin-top:4px">
      <li>Diese Datei auf einen Webspace legen — am schnellsten per Drag-and-drop auf app.netlify.com/drop, alternativ GitHub Pages.</li>
      <li>Die entstandene Adresse in Safari öffnen. Wichtig: Safari, nicht Chrome — nur dort funktioniert der Home-Bildschirm richtig.</li>
      <li>Teilen-Symbol antippen, „Zum Home-Bildschirm“ wählen, Namen bestätigen.</li>
      <li>Ab jetzt startet die App im Vollbild ohne Browserleiste und speichert dauerhaft auf dem Gerät.</li>
    </ul>
  </div>

`;
}

/* ---------- Render ---------- */
let selSport=null;
function render(){
  renderHeader();
  document.getElementById("view").innerHTML =
    TAB==="heute"?viewHeute():TAB==="woche"?viewWoche():TAB==="essen"?viewEssen():viewWerte();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
  if(TAB==="heute"&&selSport){
    const b=document.querySelector('[data-act="sport"][data-s="'+selSport+'"]');
    if(b){b.classList.add("on");document.getElementById("sportform").classList.remove("hide");}
  }
}

/* ---------- Ereignisse ---------- */
document.getElementById("ovClose").onclick=()=>{clearInterval(T.tick);T.run=false;document.getElementById("ov").classList.remove("on","rest");};
document.getElementById("ovToggle").onclick=e=>{T.run=!T.run;e.target.textContent=T.run?"Pause":"Weiter";};

document.addEventListener("change",e=>{
  if(e.target && e.target.id==="edDate" && e.target.value){
    editDate=e.target.value; selSportE=null; render();
  }
});

document.addEventListener("click",async e=>{
  const nav=e.target.closest("nav button");
  if(nav){TAB=nav.dataset.tab;window.scrollTo(0,0);render();return;}
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act, k=el.dataset.d||dkey(today()), r=dayRec(k);

  if(a==="toggle"){r[el.dataset.field]=!r[el.dataset.field];await save();render();}
  else if(a==="meal"){
    const sl=el.dataset.slot;
    r.meals[sl]=!r.meals[sl];
    if(!r.meals[sl])delete r.msrc[sl];
    await save();render();
  }
  else if(a==="msrc"){
    const sl=el.dataset.slot;
    r.msrc[sl] = r.msrc[sl]===el.dataset.v ? undefined : el.dataset.v;
    if(!r.msrc[sl])delete r.msrc[sl];
    await save();render();
  }
  else if(a==="edDay"){editDate=el.dataset.d;selSportE=null;render();}
  else if(a==="sportE"){
    selSportE = selSportE===el.dataset.s ? null : el.dataset.s;
    render();
  }
  else if(a==="saveSessionE"){
    if(!selSportE){toast("Erst eine Sportart wählen.");return;}
    const km=parseFloat((document.getElementById("eKm").value||"").replace(",","."));
    const min=parseInt(document.getElementById("eMin").value||"");
    const rpe=parseInt(document.getElementById("eRpe").value||"");
    S.sessions.push({id:Date.now()+"",date:edKey(),sport:selSportE,km:isNaN(km)?null:+km.toFixed(1),
      min:isNaN(min)?null:min,rpe:isNaN(rpe)?null:Math.min(10,Math.max(1,rpe)),
      note:(document.getElementById("eNote").value||"").trim()});
    selSportE=null;await save();toast("Einheit nachgetragen.");render();
  }
  else if(a==="persons"){S.persons=+el.dataset.n;await save();render();}
  else if(a==="start"){startSession(el.dataset.kind);}
  else if(a==="rate"){S.ratings[el.dataset.id]=+el.dataset.n;await save();toast("Bewertung gespeichert — beeinflusst die nächsten Vorschläge.");render();}
  else if(a==="sport"){
    selSport = selSport===el.dataset.s ? null : el.dataset.s;
    document.querySelectorAll('[data-act="sport"]').forEach(b=>b.classList.toggle("on",b.dataset.s===selSport));
    document.getElementById("sportform").classList.toggle("hide",!selSport);
  }
  else if(a==="saveSession"){
    if(!selSport){toast("Erst eine Sportart wählen.");return;}
    const km=parseFloat((document.getElementById("fKm").value||"").replace(",","."));
    const min=parseInt(document.getElementById("fMin").value||"");
    const rpe=parseInt(document.getElementById("fRpe").value||"");
    S.sessions.push({id:Date.now()+"",date:dkey(today()),sport:selSport,km:isNaN(km)?null:+km.toFixed(1),
      min:isNaN(min)?null:min,rpe:isNaN(rpe)?null:Math.min(10,Math.max(1,rpe)),
      note:(document.getElementById("fNote").value||"").trim()});
    selSport=null;await save();toast("Einheit gespeichert.");render();
  }
  else if(a==="delSession"){S.sessions=S.sessions.filter(s=>s.id!==el.dataset.id);await save();render();}
  else if(a==="saveWeight"){
    const kg=parseFloat((document.getElementById("wKg").value||"").replace(",","."));
    if(isNaN(kg)||kg<30||kg>250){toast("Bitte einen Wert zwischen 30 und 250 kg eintragen.");return;}
    const wk=dkey(today());
    S.weights=S.weights.filter(w=>w.date!==wk);
    S.weights.push({date:wk,kg:+kg.toFixed(1)});
    await save();toast("Gewicht eingetragen.");render();
  }
  else if(a==="ai"){await aiReview(+el.dataset.i);}
  else if(a==="forceReview"){
    const m=addDays(mondayOf(new Date()),-7);
    S.reviews.push(buildReview(m));S.lastWeek=isoWeekKey(new Date());
    await save();toast("Woche ausgewertet.");render();
  }
  else if(a==="export"){
    const box=document.getElementById("dataBox");
    box.innerHTML=`<label class="f">Sicherung</label>
      <textarea class="mono" id="expBox" style="font-size:10px;min-height:110px" readonly></textarea>
      <button class="btn ghost sm" data-act="copy" style="margin-top:8px">In die Zwischenablage kopieren</button>`;
    document.getElementById("expBox").value=JSON.stringify(S);
  }
  else if(a==="copy"){
    const t=document.getElementById("expBox");t.select();
    try{await navigator.clipboard.writeText(t.value);toast("Sicherung kopiert.");}
    catch(err){document.execCommand("copy");toast("Sicherung kopiert.");}
  }
  else if(a==="showImport"){
    document.getElementById("dataBox").innerHTML=`<label class="f">Sicherung einfügen</label>
      <textarea class="mono" id="impBox" style="font-size:10px;min-height:110px" placeholder="{ … }"></textarea>
      <button class="btn ghost sm" data-act="doImport" style="margin-top:8px">Zusammenführen</button>
      <p class="xs muted" style="margin:6px 0 0">Bestehende Einträge bleiben erhalten, fehlende werden ergänzt.</p>`;
  }
  else if(a==="doImport"){
    try{
      const inc=migrate(JSON.parse(document.getElementById("impBox").value));
      S.days=Object.assign({},inc.days,S.days);
      S.ratings=Object.assign({},inc.ratings,S.ratings);
      const ids=new Set(S.sessions.map(x=>x.id));
      inc.sessions.forEach(x=>{if(!ids.has(x.id))S.sessions.push(x);});
      const wd=new Set(S.weights.map(x=>x.date));
      inc.weights.forEach(x=>{if(!wd.has(x.date))S.weights.push(x);});
      const rw=new Set(S.reviews.map(x=>x.week));
      inc.reviews.forEach(x=>{if(!rw.has(x.week))S.reviews.push(x);});
      S.reviews.sort((a2,b2)=>a2.week<b2.week?-1:1);
      S.level=Math.max(S.level,inc.level);
      await save();toast("Sicherung zusammengeführt.");render();
    }catch(err){toast("Das war kein gültiger Sicherungstext.");}
  }
  else if(a==="reset"){
    if(el.dataset.sure){S=blank();await save();toast("Zurückgesetzt.");render();}
    else{el.dataset.sure="1";el.textContent="Wirklich alles löschen?";el.style.color="var(--miss)";el.style.borderColor="var(--miss)";}
  }
});

/* ---------- Start ---------- */
(async()=>{
  await load();
  const neu=await runWeeklyUpdate();
  render();
  if(neu){TAB="woche";render();toast("Neue Woche — Auswertung liegt bereit.");}
})();

</script>
</body>
</html>
